<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Quick</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#0b0d10;color:#f4f6f8}main{max-width:720px;margin:auto;padding:18px}.card{background:#15191f;border:1px solid #2a313a;border-radius:16px;padding:16px;margin:12px 0}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#e8edf2;color:#111;font-weight:700;margin:4px}.danger{background:#ffdddd}.muted{color:#aab3bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big{font-size:1.35rem;font-weight:800}.ok{color:#bdecc5}.warn{color:#ffd59a}</style></head>
<body><main><div class="big">Baby Quick · PAPER only</div><div class="muted">Passkey-protected. No ticker search or arbitrary BUY form.</div><div id="auth" class="card">Checking…</div><div id="app"></div></main>
<script>
const b64u=b=>{let s=btoa(String.fromCharCode(...new Uint8Array(b)));return s.replaceAll('+','-').replaceAll('/','_').replaceAll('=','')};
const ub64=s=>{s=s.replaceAll('-','+').replaceAll('_','/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const credJSON=c=>({id:c.id,rawId:b64u(c.rawId),type:c.type,response:{clientDataJSON:b64u(c.response.clientDataJSON),authenticatorData:b64u(c.response.authenticatorData),signature:b64u(c.response.signature),userHandle:c.response.userHandle?b64u(c.response.userHandle):null}});
async function api(url,opt={}){let r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function login(){let b=await api('/quick/api/login/begin',{method:'POST'});let o=b.options;o.challenge=ub64(o.challenge);o.allowCredentials=(o.allowCredentials||[]).map(x=>({...x,id:ub64(x.id)}));let c=await navigator.credentials.get({publicKey:o});await api('/quick/api/login/complete',{method:'POST',body:JSON.stringify({challenge_id:b.challenge_id,credential:credJSON(c)})});location.reload()}
async function load(){let d=await api('/quick/api/dashboard');let h=`<div class="card"><b>Today</b><div class="big">${d.trades_today} / ${d.max_trades} PAPER entries</div><div class="muted">Signals continue after the limit; only execution stops.</div><button class="danger" id="disable">Disable autopilot</button></div><h3>Pending SETUP_READY</h3>`;for(const x of d.pending){h+=`<div class="card"><div class="big">${x.symbol}</div><div>Episode ${x.ready_episode} · readiness ${x.readiness_potential}</div><div class="grid"><span>Entry ${x.entry??'-'}</span><span>Stop ${x.invalidation??'-'}</span><span>T1 ${x.target1??'-'}</span><span>T2 ${x.target2??'-'}</span></div>${d.trades_today<d.max_trades?`<button data-a="${x.symbol}|${x.ready_episode}">Approve PAPER</button>`:'<div class="warn">3/day execution limit reached — tracked only</div>'}</div>`}h+='<h3>Open PAPER positions</h3>';for(const x of d.positions){h+=`<div class="card"><div class="big">${x.symbol}</div><div>${x.quantity} shares · fill ${x.fill_price??'-'}</div><div>Stop ${x.invalidation??'-'} · T1 ${x.target1??'-'} · T2 ${x.target2??'-'}</div><button class="danger" data-c="${x.symbol}|${x.ready_episode}">Close PAPER position</button></div>`}document.querySelector('#app').innerHTML=h;document.querySelector('#disable').onclick=async()=>{if(confirm('Disable PAPER autopilot?')){await api('/quick/api/autopilot/disable',{method:'POST'});alert('Autopilot disabled')}};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{let [s,e]=b.dataset.a.split('|');if(confirm(`Approve PAPER setup ${s}?`)){let r=await api(`/quick/api/setup/${s}/${e}/approve`,{method:'POST'});alert(`Submitted ${r.quantity} ${s}`);load()}});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{let [s,e]=b.dataset.c.split('|');if(confirm(`Close PAPER position ${s}?`)){await api(`/quick/api/position/${s}/${e}/close`,{method:'POST'});alert('PAPER SELL submitted');load()}})}
api('/quick/api/status').then(s=>{if(s.authenticated){document.querySelector('#auth').innerHTML='<span class="ok">✓ Passkey session active</span>';load()}else{document.querySelector('#auth').innerHTML='<button id="login">Unlock with passkey</button>';document.querySelector('#login').onclick=login}}).catch(e=>document.querySelector('#auth').textContent=e.message);
</script></body></html>
