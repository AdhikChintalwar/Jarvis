<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enroll Baby Quick</title></head><body style="font-family:system-ui;max-width:620px;margin:30px auto;padding:16px"><h2>Enroll Baby Quick passkey</h2><p>Enter the one-time bootstrap code from /opt/baby/.env. Enrollment closes after the first passkey.</p><input id="code" type="password" style="padding:12px;width:100%;box-sizing:border-box" placeholder="Bootstrap code"><button id="go" style="padding:12px;margin-top:10px">Create passkey</button><pre id="msg"></pre><script>
const b64u=b=>{let s=btoa(String.fromCharCode(...new Uint8Array(b)));return s.replaceAll('+','-').replaceAll('/','_').replaceAll('=','')};const ub64=s=>{s=s.replaceAll('-','+').replaceAll('_','/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};const cj=c=>({id:c.id,rawId:b64u(c.rawId),type:c.type,response:{clientDataJSON:b64u(c.response.clientDataJSON),attestationObject:b64u(c.response.attestationObject)}});go.onclick=async()=>{try{let r=await fetch('/quick/api/register/begin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bootstrap_code:code.value})});let b=await r.json();if(!r.ok)throw Error(b.detail);let o=b.options;o.challenge=ub64(o.challenge);o.user.id=ub64(o.user.id);o.excludeCredentials=(o.excludeCredentials||[]).map(x=>({...x,id:ub64(x.id)}));let c=await navigator.credentials.create({publicKey:o});let r2=await fetch('/quick/api/register/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:b.challenge_id,credential:cj(c)})});let j=await r2.json();if(!r2.ok)throw Error(j.detail);msg.textContent='Passkey enrolled. Open /quick';}catch(e){msg.textContent=e.message}};
</script></body></html>
